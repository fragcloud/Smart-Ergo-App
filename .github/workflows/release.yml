name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build installer (NSIS)
        run: npx -y @tauri-apps/cli@latest build --bundles nsis

      - name: Compute SHA-256
        shell: pwsh
        run: |
          $exe = Get-ChildItem "src-tauri\target\release\bundle\nsis\*.exe" | Select-Object -First 1
          $h = Get-FileHash -Algorithm SHA256 -Path $exe.FullName
          Set-Content -Path checksums.txt -Value ("{0}  {1}" -f $h.Hash.ToLower(), $exe.Name)

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: smart-ergo-installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            checksums.txt
          body: |
            ## Smart Ergo 0.4.0 — Fase 4 (pop-up alarm & notifikasi Windows)

            - Pop-up alarm frameless always-on-top (`alarm.html`) tanpa title bar dan tanpa tombol `X`
            - `ack_alarm` optimistis: klik **Matikan Alarm** langsung menutup pop-up dan mengirim perintah ke MCU (atau langsung menutup tanpa retry bila MCU offline)
            - Cooldown episode 3 detik di backend agar pop-up muncul kembali bila MCU melewatkan ACK
            - Menu tray **Uji Alarm** aktif dan notifikasi toast Windows per episode alarm

            **Integritas:** installer unsigned (normal untuk proyek akademik).
            Verifikasi file dengan hash SHA-256 pada `checksums.txt`.