name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build installer (NSIS)
        run: npx -y @tauri-apps/cli@latest build --bundles nsis

      - name: Compute SHA-256
        shell: pwsh
        run: |
          $exe = Get-ChildItem "src-tauri\target\release\bundle\nsis\*.exe" | Select-Object -First 1
          $h = Get-FileHash -Algorithm SHA256 -Path $exe.FullName
          Set-Content -Path checksums.txt -Value ("{0}  {1}" -f $h.Hash.ToLower(), $exe.Name)

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: smart-ergo-installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            checksums.txt
          body: |
            ## Smart Ergo 0.3.0 — Fase 3 (dashboard lengkap offline-safe)

            - Port penuh dashboard kendali & telemetri ke aplikasi desktop (Chart.js & font lokal, tanpa CDN)
            - Terhubung langsung ke backend MQTT Rust (`rumqttc`) lewat Tauri IPC
            - Deteksi otomatis perangkat virtual (`Virtual_`) vs perangkat fisik pada indikator topbar
            - Sinkronisasi status LED/Buzzer dari telemetri `/ergo` dan jejak ACK real-time

            **Integritas:** installer unsigned (normal untuk proyek akademik).
            Verifikasi file dengan hash SHA-256 pada `checksums.txt`.