name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build installer (NSIS)
        run: npx -y @tauri-apps/cli@latest build --bundles nsis

      - name: Compute SHA-256
        shell: pwsh
        run: |
          $exe = Get-ChildItem "src-tauri\target\release\bundle\nsis\*.exe" | Select-Object -First 1
          $h = Get-FileHash -Algorithm SHA256 -Path $exe.FullName
          Set-Content -Path checksums.txt -Value ("{0}  {1}" -f $h.Hash.ToLower(), $exe.Name)

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: smart-ergo-installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            checksums.txt
          body: |
            ## Smart Ergo 1.0.0 — Rilis Final Aplikasi Desktop (Paket 4)

            - Dashboard kendali & telemetri offline-safe (Chart.js & font lokal, tanpa CDN)
            - Backend MQTT latar (`rumqttc`, TCP polos port 1883) dengan persistensi `%APPDATA%\id.pens.smartergo\config.json`
            - Window Pengaturan terpisah & status tray dinamis (Vital/Ergo aktif atau menunggu)
            - Pop-up alarm frameless always-on-top (`alarm.html`), `ack_alarm` optimistis, cooldown episode 3 detik, dan notifikasi toast Windows
            - Deteksi perangkat virtual (`Virtual_`) untuk pengujian bersama `Smart Ergo Simulasi`

            **Integritas:** installer unsigned (normal untuk proyek akademik).
            Verifikasi file dengan hash SHA-256 pada `checksums.txt`.